<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 3 · Jean-Louis Velaise</title>
  <style>
    :root {
      --text: #1f2933;
      --muted: #616e7c;
      --accent: #8c1515;
      --bg: #fdfdfc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0 0 0.25rem;
    }
    .tagline {
      color: var(--muted);
      font-size: 1.15rem;
      margin: 0 0 3rem;
    }
    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 2.5rem 0 0.75rem;
    }
    a { color: var(--accent); }
    .back {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    footer {
      margin-top: 4rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">&larr; Home</a>

    <header>
      <h1>Assignment 3</h1>
      <p class="tagline">Jean-Louis Velaise</p>
    </header>

    <section>
      <h2>Overview</h2>
      <p>
        Coming soon.
      </p>
    </section>

    <footer>
      &copy; 2026 Jean-Louis Velaise
    </footer>
  </main>
</body>
</html>
